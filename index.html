<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yalla English</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FF6B35">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF7EC;--card:#fff;--ink:#22223B;--muted:#77798F;--o:#FF6B35;--o2:#FFE3D6;--g:#22B573;--g2:#DDF6EA;--b:#3A86FF;--b2:#E1ECFF;--p:#8338EC;--p2:#EFE4FF;--r:#EF476F;--r2:#FFE1E8;--y:#FFBE0B;--y2:#FFF3CC;--line:#EFE6DA}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Baloo Bhaijaan 2','Nunito',system-ui,sans-serif;font-size:17px;line-height:1.55}
.en{direction:ltr;unicode-bidi:isolate;font-family:'Nunito',system-ui,sans-serif}
#app{max-width:560px;margin:0 auto;padding:14px 14px 96px}
h1,h2,h3{margin:.2em 0;line-height:1.25}
h2{font-size:1.35rem}h3{font-size:1.1rem}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.logo{font-weight:800;font-size:1.3rem}.logo b{color:var(--o)}
.pills{display:flex;gap:6px}
.pill{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:2px 10px;font-weight:800;font-size:.95rem;white-space:nowrap}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;margin:10px 0;box-shadow:0 3px 0 var(--line)}
.card.hl{border-color:var(--o);box-shadow:0 3px 0 var(--o)}
.muted{color:var(--muted);font-size:.92rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:14px;padding:11px 16px;font:inherit;font-weight:800;cursor:pointer;background:var(--o);color:#fff;box-shadow:0 4px 0 #C94B1C;transition:transform .05s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C94B1C}
.btn.g{background:var(--g);box-shadow:0 4px 0 #168553}.btn.b{background:var(--b);box-shadow:0 4px 0 #1E5FC7}.btn.p{background:var(--p);box-shadow:0 4px 0 #5A1FB0}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.sm{padding:6px 11px;font-size:.9rem;border-radius:11px}
.btn.full{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;cursor:pointer;box-shadow:0 3px 0 var(--line);text-align:center}
.tile .ic{font-size:2rem}.tile b{display:block}.tile span{font-size:.82rem;color:var(--muted)}
.step{display:flex;gap:12px;align-items:center;padding:10px;border-radius:14px;border:2px solid var(--line);margin:8px 0;cursor:pointer;background:#fff}
.step .ic{font-size:1.7rem;width:42px;text-align:center}
.step .tx{flex:1}.step .tx b{display:block}
.step.done{background:var(--g2);border-color:#A8E6C9}
.step .ck{font-size:1.4rem}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--y),var(--o));border-radius:99px}
.phrase{border:2px solid var(--line);border-radius:16px;padding:12px;margin:10px 0;background:#fff}
.phrase .e{font-size:1.25rem;font-weight:800}
.phrase .pr{color:var(--p);font-size:.95rem}
.phrase .a{color:var(--muted)}
.ib{border:0;background:var(--b2);color:var(--b);border-radius:10px;padding:5px 9px;font:inherit;font-size:.88rem;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;gap:4px;align-items:center}
.ib.v{background:var(--r2);color:var(--r)}.ib.m{background:var(--p2);color:var(--p)}
input[type=text],textarea{width:100%;font:inherit;padding:11px 13px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink);outline:none}
input[type=text]:focus,textarea:focus{border-color:var(--b)}
.fb{border-radius:14px;padding:10px 12px;margin-top:10px;font-weight:600}
.fb.ok{background:var(--g2);color:#0F6B42}.fb.close{background:var(--y2);color:#7A5A00}.fb.no{background:var(--r2);color:#9B1C3B}
.opt{display:block;width:100%;text-align:start;margin:8px 0;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 3px 0 var(--line);color:var(--ink)}
.opt.right{background:var(--g2);border-color:var(--g)}.opt.wrong{background:var(--r2);border-color:var(--r)}
.big{font-size:1.5rem;font-weight:800;text-align:center;margin:10px 0}
.center{text-align:center}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:9}
nav .in{display:flex;max-width:560px;width:100%}
nav button{flex:1;border:0;background:none;font:inherit;font-size:.78rem;font-weight:800;color:var(--muted);padding:4px;cursor:pointer;border-radius:12px}
nav button .ic{display:block;font-size:1.4rem}
nav button.on{color:var(--o);background:var(--o2)}
.chat{display:flex;flex-direction:column;gap:8px;min-height:200px}
.msg{max-width:86%;padding:10px 13px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word}
.msg.sam{align-self:flex-start;background:#fff;border:2px solid var(--line)}
html[dir=rtl] .msg.sam{align-self:flex-end}
html[dir=rtl] .msg.me{align-self:flex-start}
.msg.me{background:var(--b);color:#fff}
.msg.tip{background:var(--y2);border:2px dashed var(--y);font-size:.95rem;max-width:92%}
.msg .tools{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{border:2px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font:inherit;font-weight:800;font-size:.9rem;white-space:nowrap;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.compose{position:sticky;bottom:74px;background:var(--bg);padding:8px 0;display:flex;gap:6px;align-items:flex-end}
.compose textarea{min-height:46px;max-height:120px;resize:none}
.wk{border:2px solid var(--line);border-radius:16px;margin:8px 0;background:#fff;overflow:hidden}
.wk>.hd{padding:11px 13px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:800}
.wk .bd{padding:0 13px 12px}
.ls{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.ls:last-child{border:0}
.word{display:inline-block;margin:4px;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;font-family:'Nunito';font-weight:800;cursor:pointer;box-shadow:0 3px 0 var(--line);direction:ltr}
.word.used{opacity:.25;pointer-events:none}
.slot{min-height:56px;border:2px dashed var(--b);border-radius:14px;padding:6px;direction:ltr;text-align:left;background:var(--b2)}
.timer{font-size:2rem;font-weight:800;color:var(--o)}
.badge{display:inline-block;background:var(--p2);color:var(--p);border-radius:99px;padding:1px 9px;font-size:.8rem;font-weight:800}
.badge.g{background:var(--g2);color:var(--g)}.badge.o{background:var(--o2);color:var(--o)}
.sec{font-weight:800;margin:18px 4px 4px;color:var(--muted);font-size:.95rem}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:99px;font-weight:800;z-index:20;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
.hide{display:none!important}
a{color:var(--b)}
.pulse{animation:pl 1.2s infinite}@keyframes pl{50%{opacity:.4}}
</style>
</head>
<body>
<div id="app"></div>
<nav><div class="in">
<button data-tab="home" class="on"><span class="ic">🏠</span>اليوم</button>
<button data-tab="play"><span class="ic">🎮</span>لعب</button>
<button data-tab="chat"><span class="ic">💬</span>Sam</button>
<button data-tab="watch"><span class="ic">🎬</span>فرجة</button>
<button data-tab="plan"><span class="ic">🗺️</span>البرنامج</button>
</div></nav>
<div class="toast" id="toast"></div>
<script>
/* ============ CONTENT ============ */
// كل سيمانة: t عنوان، g الهدف، sc سيناريو للهضرة مع Sam، pr نطق السيمانة، v فيديوهات، d ستة دروس (السطر الأول: العنوان|الشرح، ومن بعد: English|الدارجة|النطق)
const W=[
{t:"سلام وتعرّف براسك",g:"تسلّم، تعرّف براسك، وتسوّل الآخر عليه",sc:"You meet him for the first time at a café in Casablanca. Greet him, ask his name, where he is from, his age and his job.",
pr:["حرف P ماشي B","فالدارجة ما كايناش P، ولكن فالانجليزية مهمة بزاف. P كتخرج بنفخة صغيرة: حط يدك قدام فمك وحس بالهوا.",["please","pen","people","park","Pepsi"]],
v:[["Peppa Pig (English)","Peppa Pig full episodes English","جمل قصار وبطيئة، مزيانة للبداية"],["Easy English – street interviews","Easy English street interview beginners greetings","ناس حقيقيين فالزنقة، مع ترجمة"],["Greetings dialogues","English conversation for beginners greetings introduce yourself","حوارات بسيطة بزاف"]],
d:[
`التحية|Hi و Hello بجوج = سلام. How are you? هو أول سؤال غيسولوك، والجواب الساهل: I'm fine.
Hi! / Hello!|سلام!|هاي! / هالو!
Good morning!|صباح الخير!|گود مورنينگ!
How are you?|كيداير؟ / لاباس؟|هاو آر يو؟
I'm fine, thank you. And you?|بخير، شكرا. ونتا؟|آيم فاين، ثانك يو. أند يو؟`,
`السمية|My name is = سميتي. ملي كتعرّف على شي حد جديد، ديما زيد: Nice to meet you.
What's your name?|شنو سميتك؟|وَتس يور نيم؟
My name is Sami.|سميتي سامي.|ماي نيم إز سامي.
Nice to meet you.|متشرفين.|نايس تو ميت يو.
Nice to meet you too.|حتى انا متشرف.|نايس تو ميت يو تو.`,
`منين نتا؟|from = من. I'm from باش تقول منين نتا، و I live in باش تقول فين ساكن.
Where are you from?|منين نتا؟|وير آر يو فروم؟
I'm from Morocco.|انا من المغرب.|آيم فروم موروكو.
I live in Casablanca.|كنسكن فكازا.|آي ليڤ إن كازابلانكا.
What about you?|ونتا؟|وَت أباوت يو؟`,
`العمر والخدمة|فالانجليزية العمر كنقولوه ب I'm (انا) ماشي ب «عندي»: I'm 25 = عندي 25 عام.
How old are you?|شحال فعمرك؟|هاو أولد آر يو؟
I'm 25 years old.|عندي 25 عام.|آيم تونتي فايڤ ييرز أولد.
What do you do?|شنو كتخدم؟|وَت دو يو دو؟
I'm a student.|انا طالب.|آيم أ ستيودنت.`,
`كلمات الأدب|كلمات صغار ولكن كيحلّو ليك جميع البيبان 😄
Please.|عافاك.|پليز.
Thank you very much.|شكرا بزاف.|ثانك يو ڤيري متش.
You're welcome.|بلا جميل / مرحبا.|يور ويلكم.
Excuse me.|سمح ليا (باش تنادي على شي حد).|إكسكيوز مي.`,
`التوديع|ملي كتسالي الهضرة ما تمشيش ساكت 😄 قول وحدة من هادو.
See you later.|نتلاقاو من بعد.|سي يو ليتر.
See you tomorrow.|نتلاقاو غدا.|سي يو تومورو.
Have a nice day!|نهارك زوين!|هاڤ أ نايس داي!
Bye! Take care.|بسلامة! تهلا فراسك.|باي! تيك كير.`]},
{t:"ملي ما تفهمش + am/is/are",g:"ما تبقاش تحبس: تطلب التكرار، وتستعمل am / is / are",sc:"He is a tourist helper in Marrakech. Speak a little fast sometimes so he practices asking you to repeat or slow down. Use am/is/are.",
pr:["حرف V ماشي F","V كتخرج بحال F ولكن مع الصوت: حط سنانك الفوقانيين على شفتك التحتانية وخلي الحلق يزنزن.",["very","have","live","video","seven"]],
v:[["Peppa Pig (English)","Peppa Pig English episodes","كمل مع Peppa، حاول تفهم بلا ترجمة"],["Extr@ English – Ep 1","Extr@ English episode 1","سيتكوم مصاوب للناس لي كيتعلمو، مضحك وبطيء"],["Asking to repeat","how to ask someone to repeat in English beginners","كيفاش تقول ما فهمتش بأدب"]],
d:[
`عاود عافاك!|أهم قاعدة فالكومونيكاسيون: ملي ما تفهمش، ما تسكتش! طلب يعاود.
Sorry?|عفاك؟ (ما سمعتش مزيان)|سوري؟
Can you repeat, please?|تقدر تعاود عافاك؟|كان يو ريپيت، پليز؟
Slowly, please.|بشوية عافاك.|سلولي، پليز.`,
`ما فهمتش|باش تسول على معنى كلمة ولا كيفاش تقول شي حاجة.
I don't understand.|ما فهمتش.|آي دونت أندرستاند.
What does "busy" mean?|شنو معنى «busy»؟|وَت دَز بيزي مين؟
How do you say "bread" in English?|كيفاش كتقول «خبز» بالانجليزية؟|هاو دو يو ساي بريد إن إنگليش؟`,
`am / is / are|I ← am — he/she/it ← is — you/we/they ← are. هادي القاعدة لي غتبقى معاك ديما!
I am tired.|انا عيان.|آي آم تايرد.
You are right.|عندك الصح.|يو آر رايت.
He is my friend.|هو صاحبي.|هي إز ماي فريند.
She is busy.|هي مشغولة.|شي إز بيزي.`,
`we / they / it|it كنستعملوها للحوايج وللجو: It is cold = البرد.
We are ready.|حنا واجدين.|وي آر ريدي.
They are at home.|هوما فالدار.|ذاي آر أت هوم.
It is cold today.|البرد اليوم.|إت إز كولد توداي.`,
`السؤال والنفي|not = ماشي. باش تسول: قدّم am/is/are: You are ← Are you?
I'm not sure.|ما متأكدش.|آيم نوت شور.
Are you okay?|واش نتا لاباس؟|آر يو أوكي؟
Is it far?|واش بعيد؟|إز إت فار؟
Yes, it is. / No, it isn't.|اه، بعيد. / لا، ماشي بعيد.|يس، إت إز. / نو، إت إزنت.`,
`قولها بلا حشمة|هاد الجمل كيخليو الناس يهضرو معاك بشوية ويعاونوك.
My English is not very good.|الانجليزية ديالي ماشي مزيانة بزاف.|ماي إنگليش إز نوت ڤيري گود.
I'm learning English.|كنتعلم الانجليزية.|آيم ليرنينگ إنگليش.
Can you help me?|تقدر تعاوني؟|كان يو هيلپ مي؟`]},
{t:"الأسئلة: What, Where, When…",g:"تسوّل أي سؤال بسيط وتفهم الجواب",sc:"Play a curious new neighbor. Ask him many simple What/Where/When/Who/How/Why questions and encourage him to ask you questions too.",
pr:["TH بجوج أصوات","think = ث (بحال ثلاثة)، this = ذ (بحال ذهب). خرّج طرف لسانك شوية بين سنانك.",["think","thank you","three","this","mother"]],
v:[["Extr@ English","Extr@ English episode 2","كمل الحلقات بالترتيب"],["Easy English – questions","Easy English street interview what is your favorite","شوف كيفاش الناس كيجاوبو على الأسئلة"],["WH questions","WH questions English conversation beginners","أمثلة بسيطة"]],
d:[
`What = شنو|What كتجي فالأول ديال السؤال.
What is this?|شنو هادا؟|وَت إز ذيس؟
What time is it?|شحال فالساعة؟|وَت تايم إز إت؟
What do you want?|شنو بغيتي؟|وَت دو يو وونت؟`,
`Where = فين|باش تسول على البلايص.
Where is the bathroom?|فين الطواليت؟|وير إز ذا باثروم؟
Where do you live?|فين كتسكن؟|وير دو يو ليڤ؟
Where are you going?|فين غادي؟|وير آر يو گوينگ؟`,
`When = فوقاش|When ولا What time باش تسول على الوقت.
When is the meeting?|فوقاش الاجتماع؟|وين إز ذا ميتينگ؟
What time do you finish work?|فوقاش كتسالي الخدمة؟|وَت تايم دو يو فينيش ورك؟
See you at five.|نتلاقاو مع الخمسة.|سي يو أت فايڤ.`,
`Who = شكون / Which = شمن|Which ملي كاين اختيار بين حوايج.
Who is that?|شكون هداك؟|هو إز ذات؟
Who is your best friend?|شكون أحسن صاحب عندك؟|هو إز يور بيست فريند؟
Which one do you like?|شمن وحدة عجباتك؟|ويتش وان دو يو لايك؟`,
`How = كيفاش / How much = بشحال|How many للحوايج لي كيتحسبو.
How much is it?|بشحال؟|هاو متش إز إت؟
How many brothers do you have?|شحال عندك من خو؟|هاو ميني براذرز دو يو هاڤ؟
How do I get there?|كيفاش نوصل لتما؟|هاو دو آي گيت ذير؟`,
`Why = علاش / Because = حيت|سول علاش، وجاوب بحيت.
Why?|علاش؟|واي؟
Why are you sad?|علاش نتا حزين؟|واي آر يو ساد؟
Because I'm tired.|حيت انا عيان.|بيكوز آيم تايرد.`]},
{t:"النهار ديالي (Present Simple)",g:"تحكي على الروتين ديالك وشنو كيعجبك",sc:"Chat as a new friend about daily routines: what time he wakes up, work, food, hobbies, what he likes and doesn't like.",
pr:["S فالآخر: s ولا z","works = سْ، lives = زْ. ملي الفعل كيسالي بصوت (v, n, y…) كتولي z.",["works","lives","plays","likes","goes"]],
v:[["Extr@ English","Extr@ English episode 3","سيتكوم الطلاب"],["Daily routine","daily routine in English for beginners","شوف شي واحد كيحكي نهارو"],["Peppa Pig – a day","Peppa Pig English morning","استمتع وحاول تفهم الأفعال"]],
d:[
`الصباح ديالي|Present Simple = الحوايج لي كتديرهم ديما. I + الفعل بلا تغيير.
I wake up at seven.|كنفيق مع السبعة.|آي ويك أپ أت سيڤن.
I have breakfast.|كنفطر.|آي هاڤ بريكفاست.
I take a shower.|كندوش.|آي تيك أ شاور.`,
`الخدمة|by bus = فالطوبيس، by car = فالطوموبيل.
I go to work by bus.|كنمشي للخدمة فالطوبيس.|آي گو تو ورك باي باص.
I start at nine.|كنبدا مع التسعة.|آي ستارت أت ناين.
I come back home at six.|كنرجع للدار مع الستة.|آي كام باك هوم أت سيكس.`,
`شنو كيعجبك|like = كيعجبني، love = كنموت عليه، don't like = ما كيعجبنيش.
I like football.|كتعجبني الكورة.|آي لايك فوتبول.
I love coffee.|كنموت على القهوة.|آي لاڤ كوفي.
I don't like waiting.|ما كيعجبنيش نتسنا.|آي دونت لايك ويتينگ.`,
`هو / هي + s|مع he / she / it كنزيدو s للفعل: I work ← He works.
He works in a bank.|هو كيخدم فبنكة.|هي وركس إن أ بانك.
She lives with her family.|هي ساكنة مع عائلتها.|شي ليڤز ويذ هير فاميلي.
My brother plays video games.|خويا كيلعب الألعاب.|ماي براذر پلايز ڤيديو گيمز.`,
`السؤال ب Do / Does|Do you…? = واش نتا…؟ — Does he/she…? = واش هو/هي…؟
Do you like music?|واش كتعجبك الموسيقى؟|دو يو لايك ميوزيك؟
Yes, I do. / No, I don't.|اه. / لا.|يس، آي دو. / نو، آي دونت.
Does she speak English?|واش هي كتهضر الانجليزية؟|دَز شي سپيك إنگليش؟`,
`ديما / بعض المرات / عمرني|always ديما، sometimes بعض المرات، never عمرني.
I always drink tea.|ديما كنشرب أتاي.|آي أولويز درينك تي.
I sometimes go to the gym.|بعض المرات كنمشي للصالة.|آي سامتايمز گو تو ذا جيم.
I never smoke.|عمرني كنكمي.|آي نيڤر سموك.
How often do you go out?|كل شحال كتخرج؟|هاو أوفن دو يو گو آوت؟`]},

d:[
`فالقهوة|Can I have…? ولا I'd like… هوما أحسن طريقة مؤدبة باش تطلب.
Can I have a coffee, please?|عطيني قهوة عافاك.
I'd like a sandwich.|بغيت ساندويتش.
For here or to go?|هنا ولا تديها معاك؟`,
`فالريسطو|the bill = الحساب.
Can I see the menu, please?|نقدر نشوف المنيو عافاك؟
What do you recommend?|شنو كتنصحني؟
The bill, please.|الحساب عافاك.`,
`فالحانوت|too = بزاف (بمعنى ماشي مزيان).
How much is this shirt?|بشحال هاد القميجة؟
Do you have a bigger size?|واش عندك قياس كبر؟
It's too expensive.|غالية بزاف.`,
`الخلاص|I'll take it = غادي ناخدها.
Can I pay by card?|نقدر نخلص بالكارط؟
I'm just looking, thanks.|غير كنشوف، شكرا.
I'll take it.|غادي ناخدها.`,
`الفلوس والصرف|change = الصرف.
It's twenty dollars.|عشرين دولار.
Do you have change?|عندك الصرف؟
Keep the change.|خلي الصرف عندك.`,
`نجرّب ونتفاهم|try on = نجرب الحوايج.
Is there a discount?|واش كاين شي تخفيض؟
Can I try it on?|نقدر نجربها؟
Where can I pay?|فين نخلص؟`]},
{t:"الطريق والبلايص",g:"تسول على الطريق وتفهم الجواب",sc:"He is lost in a new city and asks you for directions. Give simple directions (straight, left, right, next to, in front of).",
pr:["ED فالماضي (3 أصوات)","watched = تْ، played = دْ، wanted = إدْ. ماشي ديما «إد»!",["watched","played","wanted","worked","needed"]],

d:[
`فين كاين…؟|near here = قريب من هنا.
Excuse me, where is the station?|سمح ليا، فين كاينة لاگار؟
Is there a pharmacy near here?|واش كاينة شي فرمسيان قريبة من هنا؟
How far is it?|شحال بعيد؟`,
`الاتجاهات|straight = نيشان، left = ليسر، right = ليمن.
Go straight.|سير نيشان.
Turn left.|دور على ليسر.
Turn right.|دور على ليمن.`,
`حدا، قدام، مور|next to حدا، in front of قدام، behind مور.
It's next to the bank.|حدا البنكة.
It's in front of the mosque.|قدام الجامع.
It's behind the school.|مور المدرسة.`,
`تفاصيل|on foot = على رجليك.
Take the first street on the right.|خود أول زنقة على ليمن.
It's about ten minutes on foot.|شي عشر دقايق على رجليك.
You can't miss it.|غادي تلقاه ساهل.`,
`النقل|leave = يخرج / يمشي.
Which bus goes to the airport?|شمن طوبيس كيمشي للمطار؟
A ticket to Rabat, please.|ورقة للرباط عافاك.
What time does the train leave?|فوقاش كيخرج التران؟`,
`تلفت!|ما تخافش تسول، الناس كيحبو يعاونو.
I'm lost.|تلفت.
Can you show me on the map?|تقدر توريني فالخريطة؟
Thanks for your help!|شكرا على المساعدة!`]},
{t:"البارح والويكاند (الماضي)",g:"تحكي شنو درتي البارح ولا فالويكاند",sc:"Ask him what he did yesterday and last weekend. React with interest and ask follow-up questions. Use past simple.",

d:[
`was / were|am/is ← was — are ← were.
I was at home yesterday.|كنت فالدار البارح.
Where were you?|فين كنتي؟
It was amazing!|كانت واعرة!`,
`أفعال + ed|الأفعال العادية كنزيدو ليهم ed فالماضي.
I watched a movie.|تفرجت ففيلم.
We played football.|لعبنا الكورة.
I worked late.|خدمت حتى لمعطل.`,
`أفعال شاذة|go ← went، see ← saw، eat ← ate. حفظهم بحال الكلمات.
I went to the beach.|مشيت للبحر.
I saw my friends.|شفت صحابي.
I ate tajine.|كليت الطاجين.`,
`النفي والسؤال|didn't + الفعل الأصلي (ماشي went!).
I didn't go out.|ما خرجتش.
Did you sleep well?|واش نعستي مزيان؟
Yes, I did. / No, I didn't.|اه. / لا.`,
`كيف داز؟|أسئلة كتفتح الهضرة.
What did you do last weekend?|شنو درتي فالويكاند لي داز؟
How was your day?|كيف داز نهارك؟
It was a long day.|كان نهار طويل.`,
`الوقت فالماضي|ago = هادي.
two days ago|هادي جوج ايام
last night|البارح فالليل
When I was a child, I lived in Fes.|ملي كنت صغير كنت ساكن ففاس.`]},
{t:"الإحساس والرأي",g:"تعبّر على شنو حاس وشنو كتفكر",sc:"Talk about feelings and opinions on simple topics (food, football, social media, cities). Ask what he thinks and react with empathy.",

v:[["Extr@ English","Extr@ English episode 7","كمل"],["Feelings & opinions","expressing opinions in English for beginners","I think / I agree"],["Kiki's Delivery Service (English)","Kiki's Delivery Service English dub clip","أنمي جميل وواضح"]],
d:[
`كيف حاس؟|a bit = شوية.
I'm happy.|انا فرحان.
I'm a bit stressed.|انا مستريسي شوية.
I'm bored.|مالّيت / تقلقت.`,
`الرأي ديالي|I think = كنظن / كنشوف.
I think it's a good idea.|كنظن فكرة مزيانة.
In my opinion, it's too expensive.|فرأيي، غالي بزاف.
I don't think so.|ما كنظنش.`,
`متافق ولا لا|agree = متافق.
I agree with you.|متافق معاك.
I don't agree.|ما متافقش.
You have a point.|عندك شي حق.`,
`ردة الفعل|ملي شي حد يحكي ليك شي خبر.
That's great!|زوين بزاف!
That's too bad.|خسارة.
I'm sorry to hear that.|متأسف نسمع هادشي.`,
`سول على الرأي|It depends = على حساب.
What do you think?|شنو كتشوف نتا؟
Do you like it?|واش عجبك؟
It depends.|على حساب.`,
`كنفضل|prefer A to B = كنفضل A على B.
I prefer tea to coffee.|كنفضل أتاي على القهوة.
I'd rather stay home.|نفضل نبقى فالدار.
It's not my thing.|ماشي ديالي هادشي.`]},
{t:"المستقبل والبلانات",g:"تهضر على شنو غادي دير",sc:"Ask about his plans for tonight, the weekend, and his dreams for the future. Use going to and will.",
pr:["الكلمات الصغار كيتنقصو","فالهضرة السريعة to كتولي «تَ»، and كتولي «ن»، for كتولي «فَر». هادي علاش كتحس الناس كيهضرو بالزربة!",["going to","bread and butter","for you","a cup of tea","fish and chips"]],

d:[
`going to|بلان مقرر: I'm going to + الفعل.
I'm going to travel next month.|غادي نسافر الشهر الجاي.
What are you going to do tonight?|شنو غادي دير الليلة؟
I'm going to study.|غادي نقرا.`,
`will|قرار دابا ولا وعد: I'll = I will.
I'll call you later.|غادي نعيط ليك من بعد.
I'll help you.|غادي نعاونك.
Don't worry, it will be fine.|ما تخافش، غادي تدوز مزيان.`,
`بلانات مقررة|-ing مع وقت فالمستقبل = موعد مقرر.
I'm meeting a friend tomorrow.|عندي موعد مع صاحبي غدا.
Are you working on Saturday?|واش خدام نهار السبت؟
We're leaving at eight.|غادي نخرجو مع التمنية.`,
`يمكن…|maybe = يمكن، I hope so = ان شاء الله / نتمنى.
Maybe I'll stay home.|يمكن نبقى فالدار.
I'm not sure yet.|مازال ما متأكدش.
I hope so.|ان شاء الله.`,
`الأحلام|become = يولي.
My dream is to live in Canada.|الحلم ديالي نعيش فكندا.
I want to become a developer.|بغيت نولي ديفلوبور.
One day, I will speak English fluently.|شي نهار غادي نهضر الانجليزية مزيان.`,
`الويكاند|Let's see = نشوفو.
What are your plans for the weekend?|شنو البلانات ديالك للويكاند؟
Nothing special.|والو، عادي.
Let's see.|نشوفو.`]},

pr:["Stress — فين كتضغط","فكل كلمة كاين مقطع قوي: PHO-to، ba-NA-na، TO-day؟ لا: to-DAY. حاول تسمع المقطع القوي.",["photo","banana","today","computer","important"]],

d:[
`الجو|الجو هو أسهل موضوع باش تبدا مع أي واحد.
Nice weather today, right?|الجو زوين اليوم، ياك؟
It's so hot!|السخانة بزاف!
It's raining again.|عاود كتصب الشتا.`,
`الهوايات|be into = كنموت على / كيعجبني بزاف.
What do you do for fun?|شنو كدير باش تفوج؟
I'm into music.|كنموت على الموسيقى.
Me too!|حتى انا!`,
`ردة الفعل|هاد الكلمات كيوريو بلي راك منتابع.
Really?|بصح؟
That's interesting!|مزيان، مثير!
No way!|مستحيل! / والله ما…`,
`سول باش تكمل|سؤال المتابعة هو سر الهضرة الزوينة.
How was it?|كيف دازت؟
Tell me more.|زيد حكي ليا.
And then what happened?|ومن بعد شنو وقع؟`,
`عطي راسك الوقت|ملي ما لقيتيش الكلمة، ما تسكتش: قول هادو.
Well…|يعني…
Let me think…|خليني نفكر…
You know…|عرفتي…`,
`سالي بأدب|ما تمشيش فجأة 😄
It was nice talking to you.|فرحت ملي هضرت معاك.
I have to go now.|خاصني نمشي دابا.
Let's keep in touch.|نبقاو على اتصال.`]},
{t:"العروضات، المواعيد والتيليفون",g:"تعرض، تقبل، ترفض بأدب وتهضر فالتيليفون",sc:"Invite him to do something (coffee, cinema, football). Let him accept or refuse politely, then agree on time and place. Sometimes switch to a phone call or text messages.",
pr:["Linking — الكلمات كيتلصقو","Can I كتولي «كانآي»، Not at all كتولي «نوتاتول». الكلمة لي كتسالي بحرف ساكن كتلصق فلي من بعدها.",["Can I","not at all","pick it up","an apple","turn off"]],

d:[
`العرض|grab a coffee = نشربو شي قهوة.
Do you want to grab a coffee?|بغيتي نشربو شي قهوة؟
Are you free tonight?|واش خاوي الليلة؟
Let's go to the cinema.|يالا نمشيو للسينما.`,
`القبول|Sounds good = مزيان / واخا.
Sure, I'd love to!|أكيد، بكل فرح!
Sounds good!|واخا، مزيان!
Why not?|علاش لا؟`,
`الرفض بأدب|ديما عطي سبب صغير.
Sorry, I can't. I'm busy.|سمح ليا، ما نقدرش. مشغول.
Maybe next time.|يمكن مرة اخرى.
Thanks, but I have plans.|شكرا، ولكن عندي شي بلان.`,
`الوقت والبلاصة|How about…? = اش بان ليك ف…؟
What time works for you?|شمن وقت مناسب ليك؟
How about Friday?|اش بان ليك فالجمعة؟
Let's meet at the café.|نتلاقاو فالقهوة.`,
`التيليفون|call back = تعاود تعيط.
Hello, it's Sami.|ألو، انا سامي.
Can I speak to Adam?|نقدر نهضر مع آدم؟
Can you call me back?|تقدر تعاود تعيط ليا؟`,
`الميساجات|running late = متعطل.
I'm on my way.|انا فالطريق.
I'll be there in ten minutes.|غادي نوصل فعشر دقايق.
Sorry, I'm running late.|سمح ليا، تعطلت شوية.`]},
{t:"المشاكل، المساعدة والاعتذار",g:"تحل المشاكل وتطلب المساعدة وتعتذر بأدب",sc:"Role-play everyday problems: a broken phone at a shop, a wrong order at a restaurant, feeling sick at a pharmacy. He must explain the problem and ask for help politely.",
pr:["Intonation — الصوت كيطلع ولا كيهبط","أسئلة Yes/No: الصوت كيطلع ↗ (Are you okay?). أسئلة What/Where: كيهبط ↘ (Where do you live?).",["Are you okay?","Is it far?","Where do you live?","What's your name?","Do you like it?"]],
v:[["Extr@ English","Extr@ English episode 13","كمل"],["At the doctor","at the doctor English conversation beginners","حوار عند الطبيب"],["Friends","Friends TV show funny scenes English subtitles","كمل"]],
d:[
`عندي مشكل|doesn't work = ما خدامش.
I have a problem.|عندي مشكل.
Something is wrong with my phone.|التيليفون ديالي فيه شي مشكل.
It doesn't work.|ما خدامش.`,
`طلب بأدب|Could you…? أدب كتر من Can you…?
Could you help me, please?|تقدر تعاوني عافاك؟
Could you open the window?|تقدر تحل الشرجم؟
Would you mind waiting a minute?|واش ما عندك مشكل تتسنى دقيقة؟`,
`الاعتذار|ملي تغلط، قول So sorry وما تحماقش 😄
I'm so sorry.|سمح ليا بزاف.
It was my fault.|الغلط ديالي.
No problem. Don't worry about it.|ماشي مشكل. ما تخممش فيها.`,
`عند الطبيب|feel well = حاس براسي مزيان.
I don't feel well.|ما حاسش براسي مزيان.
I have a headache.|كيضرني راسي.
I need a doctor.|خاصني طبيب.`,
`الشكاية بأدب|refund = ترجع الفلوس.
Excuse me, this is not what I ordered.|سمح ليا، هادشي ماشي هو لي طلبت.
Could I get a refund?|نقدر نرجع فلوسي؟
I'd like to speak to the manager.|بغيت نهضر مع المسؤول.`,
`الطوارئ|حفظهم، الله يحفظ.
Help!|عتقوني!
Call the police!|عيطو للبوليس!
Where is the nearest hospital?|فين أقرب سبيطار؟`]},
{t:"الخدمة والقراية",g:"تهضر على الخدمة، القراية، وتدوز انتيرفيو بسيط",sc:"Simulate a simple, friendly job interview, then a chat between colleagues at work. Ask about experience, strengths and goals.",
pr:["Schwa ə — أهم صوت","أغلب الحروف الضعيفة كتولي «أَ» خفيفة: banana = بَنانَ، about = أَباوت، doctor = دوكتَر.",["about","banana","doctor","problem","today"]],
v:[["Job interview","job interview English beginners example","انتيرفيو بالانجليزية"],["Easy English – jobs","Easy English what is your job street interview","ناس كيهضرو على خدمتهم"],["Spider-Man: Into the Spider-Verse","Spider-Man Into the Spider-Verse clips","فيلم أنيميشن، طاقة زوينة"]],
d:[
`الخدمة ديالي|looking for = كنقلب على.
I work as a technician.|كنخدم تقني.
I'm looking for a job.|كنقلب على خدمة.
I study computer science.|كنقرا المعلوميات.`,
`الانتيرفيو|experience = تجربة.
Tell me about yourself.|حكي ليا على راسك.
I have two years of experience.|عندي جوج سنين ديال التجربة.
I'm good at working in a team.|مزيان فالخدمة مع الفريق.`,
`نقاط القوة|fast learner = كنتعلم بالزربة.
I'm a fast learner.|كنتعلم بالزربة.
I'm hard-working.|انا جدّي فالخدمة.
I'm always on time.|ديما كنجي فالوقت.`,
`الميتينگ والإيميل|get back to you = نرجع ليك بالجواب.
Can we schedule a meeting?|نقدرو نحددو شي ميتينگ؟
I'll send you an email.|غادي نصيفط ليك إيميل.
Let me check and get back to you.|خليني نشوف ونرجع ليك.`,
`ما فهمتش فالخدمة|ماشي عيب تسول، العيب تخدم غالط 😉
Could you explain that again?|تقدر تشرح ليا هادشي مرة اخرى؟
What do you mean exactly?|شنو كتقصد بالضبط؟
Just to be clear, the deadline is Friday?|غير باش نكون فاهم، الأجل هو الجمعة؟`,
`سالي الانتيرفيو|look forward to = كنتسنى بفرح.
Thank you for your time.|شكرا على الوقت ديالك.
I look forward to hearing from you.|كنتسنى الجواب ديالك.
When can I start?|فوقاش نقدر نبدا؟`]},
{t:"حكي قصة",g:"تحكي قصة ولا حاجة وقعات ليك بالترتيب",sc:"Ask him to tell you stories (a funny day, a trip, a problem). Help him use first/then/after that/suddenly. Tell short stories yourself too.",
pr:["Contractions فالهضرة","الناس ما كيقولوش I am / do not، كيقولو I'm / don't. تعلم تسمعهم: I'd، you'll، wasn't.",["I'm","don't","I'll","wasn't","I'd like"]],
v:[["Storytelling","tell a story in English simple past beginners","كيفاش تحكي قصة"],["Your Name (English dub)","Your Name anime English dub clip","أنمي مشهور"],["Friends","Friends best stories scenes","كمل"]],
d:[
`الترتيب|First، Then، After that، Finally.
First, I woke up late.|فالأول، فقت معطل.
Then, I missed the bus.|من بعد، فاتني الطوبيس.
After that, I took a taxi.|من بعد داكشي، خديت طاكسي.
Finally, I arrived at work.|فالأخير، وصلت للخدمة.`,

/* ============ LESSON ============ */
function startLesson(gi){if(gi>=TOTAL){toast('سالا البرنامج 🎓');return}if(gi%7===6){startTest(gi);return}open({type:'lesson',g:gi,i:-1,ans:'',res:null})}
function vLesson(){const v=view,w=Math.floor(v.g/7),L=W[w].L[v.g%7];
 if(v.i<0)return backBar('السيمانة '+(w+1)+' · النهار '+(v.g%7+1))+`
 <h2>📘 ${esc(L.t)}</h2><div class="card" style="background:var(--b2)">💡 ${bidi(L.n)}</div>
 <div class="muted">1) سمع كل جملة 2–3 مرات وعاودها بصوت عالي. 2) دوز لـ 🎬 باش تشوف ناس حقيقيين كيقولوها فالفيديوهات.</div>
 ${L.p.map(p=>`<div class="phrase"><div class="e en">${esc(p.en)}</div>${p.pr?`<div class="pr">🗣 ${esc(p.pr)}</div>`:''}<div class="a">🇲🇦 ${esc(p.ar)}</div>
 <div class="row" style="margin-top:6px">${spk(p.en)}${slow(p.en)}<a class="ib v" href="${yg(p.en)}" target="_blank" rel="noopener">🎬 فالفيديوهات</a></div></div>`).join('')}
 <button class="btn full" data-act="lstart">يالا نتمرنو 💪</button>`;
 if(v.i<L.p.length){const p=L.p[v.i];const r=v.res;
  return backBar('تمرين '+(v.i+1)+'/'+L.p.length)+`<div class="card center">
  <div class="muted">كيفاش تقول هادي بالانجليزية؟</div><div class="big">${esc(p.ar)}</div>
  <div class="row" style="flex-wrap:nowrap"><input type="text" id="ans" class="en" placeholder="Type in English…" value="${esc(v.ans)}" autocomplete="off" ${r?'disabled':''}>${micBtn('ans')}</div>
  ${r?`<div class="fb ${r}">${r==='ok'?'🎉 Perfect!':r==='close'?'👌 قريب بزاف! شوف الصحيحة:':'💪 ماشي مشكل، هاهي:'}<div class="en" style="font-size:1.15rem;margin-top:4px">${esc(p.en)}</div><div class="row" style="justify-content:center;margin-top:6px">${spk(p.en)}</div></div>
  <button class="btn full g" style="margin-top:12px" data-act="lnext">التالي ←</button>`:
  `<div class="row" style="margin-top:12px"><button class="btn b" style="flex:1" data-act="lcheck">تحقق</button><button class="btn ghost" data-act="lshow">ما عرفتش</button></div>`}
  </div>`}
 return backBar('')+`<div class="card center"><div style="font-size:3rem">🎉</div><h2>ساليتي الدرس!</h2><p>هاد الجمل تزادو للمراجعة ديالك. غدا غادي نسولك عليهم باش ما تنساهمش.</p>
 <button class="btn full g" data-act="lfinish">✅ سجل الدرس (+10 ⭐)</button>
 <button class="btn full ghost" style="margin-top:8px" data-act="lchat">💬 تمرن عليهم مع Sam</button></div>`}
function finishLesson(){const v=view,L=W[Math.floor(v.g/7)].L[v.g%7];addCards(L.p);S.done[v.g]=S.done[v.g]||today();if(S.g<=v.g)S.g=v.g+1;mark('l',10)}

/* ============ QUIZ ENGINE ============ */
function mkQ(card,pool,kind){const others=pick(pool.filter(c=>c.id!==card.id&&firstAlt(c.en)!==firstAlt(card.en)),3);
 if(kind==='listen')return {k:'listen',c:card,opts:shuffle([card,...others])};
 if(kind==='type')return {k:'type',c:card};
 if(kind==='en2ar')return {k:'en2ar',c:card,opts:shuffle([card,...others])};
 return {k:'ar2en',c:card,opts:shuffle([card,...others])}}
function mkReply(r){return {k:'reply',r,opts:shuffle([r[2],r[3],r[4]])}}
function runQuiz(title,qs,onEnd,endLabel){open({type:'quiz',title,qs,i:0,score:0,ans:null,txt:'',onEnd,endLabel})}
/* ---- placement test: skip weeks you already know ---- */
function skipWeek(w){const t=today();for(let d=0;d<7;d++)if(!S.done[w*7+d])S.done[w*7+d]=t;ALL.filter(c=>c.w===w).forEach(c=>{if(!S.cards[c.id])S.cards[c.id]={b:3,due:addDays(t,2+Math.floor(Math.random()*6)),wr:0,s:w*7}});S.tests[w]=Math.max(S.tests[w]||0,100);if(S.g<(w+1)*7)S.g=(w+1)*7}
function startPlace(w,single){if(w>=W.length){toast('🎓 كتعرف كلشي!');return}
 const wk=ALL.filter(c=>c.w===w);const pool=ALL.filter(c=>c.w<=w+1);const cs=pick(wk,4);
 const qs=[mkQ(cs[0],pool,'ar2en'),mkQ(cs[1],pool,'type'),mkQ(cs[2],pool,canSpeak()?'listen':'ar2en'),mkQ(cs[3],pool,'ar2en')];
 const rp=RP.filter(r=>r[0]===w);qs.push(rp.length?mkReply(pick(rp,1)[0]):mkQ(pick(wk.filter(c=>!cs.includes(c)),1)[0]||cs[0],pool,'en2ar'));
 runQuiz('⚡ تحديد المستوى · السيمانة '+(w+1)+': '+W[w].t,qs,(score)=>{
  if(score>=4){skipWeek(w);save();if(single){toast('✅ دوزتي السيمانة '+(w+1));go('plan');return}toast('✅ السيمانة '+(w+1)+' دوزتيها! نشوفو اللي من موراها');startPlace(w+1)}
  else{S.placed=1;save();toast('📍 غتبدا من السيمانة '+(w+1)+': '+W[w].t);go('home')}},'كمل ←')}
function vQuiz(){const v=view;if(v.i>=v.qs.length){const pct=Math.round(v.score/v.qs.length*100);return backBar(v.title)+`<div class="card center"><div style="font-size:3rem">${pct>=80?'🏆':pct>=60?'👏':'💪'}</div><h2>${v.score} / ${v.qs.length}</h2><p>${pct>=80?'واعر! راك ضابط.':pct>=60?'مزيان! شوية ديال المراجعة وصافي.':'ماشي مشكل، الجمل لي غلطتي فيهم غادي يرجعو ليك فالمراجعة.'}</p><button class="btn full g" data-act="qend">${v.endLabel||'سالي ✓'}</button></div>`}
 const q=v.qs[v.i],a=v.ans;let body='';
 const listen=q.k==='listen'||q.k==='reply';
 if(q.k==='ar2en'){body=`<div class="muted">شمن جملة كتعني:</div><div class="big">${esc(q.c.ar)}</div>`+q.opts.map((o,j)=>optBtn(o.en,j,o.id===q.c.id,a,true)).join('')}
 else if(q.k==='en2ar'){body=`<div class="muted">شنو معنى:</div><div class="big en">${esc(q.c.en)}</div><div class="center">${spk(q.c.en)}</div>`+q.opts.map((o,j)=>optBtn(o.ar,j,o.id===q.c.id,a,false)).join('')}
 else if(q.k==='listen'){const show=!canSpeak()||a!==null;body=`<div class="muted">🎧 سمع، واختار شنو سمعتي (فكر بالانجليزية!)</div><div class="center" style="margin:12px">${canSpeak()?`<button class="btn b" data-say="${esc(q.c.en)}">🔊 سمع</button> ${slow(q.c.en)}`:''}</div>${show?`<div class="center en muted">${esc(q.c.en)}</div>`:''}`+q.opts.map((o,j)=>optBtn(o.en,j,o.id===q.c.id,a,true)).join('')}
 else if(q.k==='reply'){const corr=q.r[2];body=`<div class="muted">🎧 شي واحد قال ليك هادي. شنو تجاوبو؟</div><div class="center" style="margin:12px">${canSpeak()?`<button class="btn b" data-say="${esc(q.r[1])}">🔊 سمع</button> ${slow(q.r[1])}`:''}</div>${(!canSpeak()||a!==null)?`<div class="big en">${esc(q.r[1])}</div>`:`<div class="center"><button class="ib" data-act="reveal">👀 ورّيني الجملة</button></div>`}`+q.opts.map((o,j)=>optBtn(o,j,o===corr,a,true)).join('')}
 else if(q.k==='type'){const audio=canSpeak()&&q.dict;body=audio?`<div class="muted">🎧 سمع وكتب شنو سمعتي</div><div class="center" style="margin:12px"><button class="btn b" data-say="${esc(q.c.en)}">🔊 سمع</button> ${slow(q.c.en)}</div>`:`<div class="muted">كتب بالانجليزية:</div><div class="big">${esc(q.c.ar)}</div>`;
  body+=`<div class="row" style="flex-wrap:nowrap"><input type="text" id="ans" class="en" placeholder="Type in English…" value="${esc(v.txt)}" autocomplete="off" ${a!==null?'disabled':''}>${micBtn('ans')}</div>`;
  if(a!==null)body+=`<div class="fb ${a}">${a==='ok'?'🎉 Perfect!':a==='close'?'👌 قريب! هاهي الصحيحة:':'💪 هاهي:'}<div class="en" style="font-size:1.1rem">${esc(q.c.en)}</div></div>`;
  else body+=`<button class="btn b full" style="margin-top:10px" data-act="qtype">تحقق</button>`}
 return backBar(v.title+' · '+(v.i+1)+'/'+v.qs.length)+`<div class="bar"><i style="width:${v.i/v.qs.length*100}%"></i></div><div class="card">${body}
 ${a!==null?`<div class="row" style="justify-content:center;margin-top:8px">${q.c?spk(q.c.en):spk(q.r[2])}</div><button class="btn full g" style="margin-top:10px" data-act="qnext">التالي ←</button>`:''}</div>`}
function optBtn(text,j,correct,a,en){let cls='';if(a!==null){if(correct)cls='right';else if(a===j)cls='wrong'}return `<button class="opt ${cls} ${en?'en':''}" data-opt="${j}" ${a!==null?'disabled':''}>${esc(text)}</button>`}
function answerOpt(j){const v=view,q=v.qs[v.i];if(v.ans!==null)return;v.ans=j;let ok;if(q.k==='reply')ok=q.opts[j]===q.r[2];else ok=q.opts[j].id===q.c.id;if(ok){v.score++;S.xp+=2}if(q.c)srs(q.c.id,ok);if(!ok&&q.c)S.weak=[q.c.id,...S.weak.filter(x=>x!==q.c.id)].slice(0,20);save();render();if(ok&&q.k!=='reply'&&canSpeak())speak(q.c.en)}
function answerType(){const v=view,q=v.qs[v.i];const val=($('#ans')||{}).value||'';v.txt=val;const r=grade(val,q.c.en);v.ans=r;if(r!=='no'){v.score++;S.xp+=3}srs(q.c.id,r!=='no');save();render()}

function nightQuiz(){const L=learnedCards();if(L.length<3){toast('دير أول درس باش يكون عندك كويز');startLesson(S.g);return}
 const weak=S.weak.map(id=>BYID[id]).filter(Boolean);const recent=L.filter(c=>(S.cards[c.id].s||0)>=S.g-2);
 const chosen=[];const add=c=>{if(c&&!chosen.includes(c))chosen.push(c)};pick(recent,2).forEach(add);pick(weak,2).forEach(add);pick(L,8).forEach(c=>{if(chosen.length<5)add(c)});
 const kinds=['listen','ar2en','type','listen','en2ar'];let qs=chosen.slice(0,5).map((c,i)=>{const q=mkQ(c,ALL.filter(x=>x.w<=curW()),kinds[i%kinds.length]);if(q.k==='type')q.dict=true;return q});
 const rp=RP.filter(r=>r[0]<=curW());pick(rp,2).forEach(r=>qs.splice(Math.floor(Math.random()*qs.length),0,mkReply(r)));
 runQuiz('كويز الليل',qs,()=>mark('q',5))}
function startTest(gi){const w=Math.floor(gi/7);const wk=ALL.filter(c=>c.w===w);const old=ALL.filter(c=>c.w<w);
 const cards=[...pick(wk,9),...pick(old,Math.min(3,old.length))];const kinds=['ar2en','listen','type','en2ar'];
 const qs=shuffle(cards).map((c,i)=>{const q=mkQ(c,ALL.filter(x=>x.w<=w),kinds[i%4]);return q});
 pick(RP.filter(r=>r[0]<=w),3).forEach(r=>qs.push(mkReply(r)));
 runQuiz('🏆 اختبار السيمانة '+(w+1),qs,(score,n)=>{const pct=Math.round(score/n*100);S.tests[w]=Math.max(S.tests[w]||0,pct);addCards(wk);if(pct<60){wk.forEach(c=>{if(S.cards[c.id]){S.cards[c.id].due=today()}})}S.done[gi]=S.done[gi]||today();if(S.g<=gi)S.g=gi+1;mark('l',20);toast(pct>=60?'نجحتي فالاختبار 🎉':'الجمل ديال السيمانة رجعو للمراجعة')})}

/* ============ REVIEW (SRS) ============ */
function startReview(free){let ids=free?pick(Object.keys(S.cards),10):dueCards().sort((a,b)=>S.cards[a].due<S.cards[b].due?-1:1).slice(0,20);
 if(!ids.length){if(!Object.keys(S.cards).length){toast('دير أول درس قبل');return}if(!free){mark('r');toast('ما كاين والو للمراجعة اليوم ✅');return}}
 open({type:'review',ids,i:0,flip:false,ok:0,free,again:[]})}
function vReview(){const v=view;if(v.i>=v.ids.length)return backBar('مراجعة')+`<div class="card center"><div style="font-size:3rem">🧠</div><h2>سالات المراجعة</h2><p>عرفتي ${v.ok} من ${v.ids.length}. هاكا كتبقى المعلومة فراسك!</p><button class="btn full g" data-act="rend">سالي ✓</button></div>`;
 const c=BYID[v.ids[v.i]];const mode=(S.cards[c.id].b>=3&&canSpeak())?'listen':'ar';
 return backBar('مراجعة '+(v.i+1)+'/'+v.ids.length)+`<div class="bar"><i style="width:${v.i/v.ids.length*100}%"></i></div><div class="card center">
 ${mode==='ar'?`<div class="muted">قول بصوت عالي بالانجليزية:</div><div class="big">${esc(c.ar)}</div>`:`<div class="muted">🎧 سمع… واش فاهم شنو كتعني؟ قولها معاه</div><div style="margin:12px"><button class="btn b" data-say="${esc(c.en)}">🔊 سمع</button> ${slow(c.en)}</div>`}
 ${v.flip?`<div class="phrase"><div class="e en">${esc(c.en)}</div>${c.pr?`<div class="pr">🗣 ${esc(c.pr)}</div>`:''}<div class="a">🇲🇦 ${esc(c.ar)}</div><div class="row" style="justify-content:center;margin-top:6px">${spk(c.en)}<a class="ib v" href="${yg(c.en)}" target="_blank" rel="noopener">🎬</a></div></div>
 <div class="row"><button class="btn" style="flex:1;background:var(--r);box-shadow:0 4px 0 #B32A4E" data-act="rno">نسيتها 😅</button><button class="btn g" style="flex:1" data-act="rok">عرفتها 💪</button></div>`:
 `<button class="btn full b" style="margin-top:12px" data-act="rflip">ورّيني الجواب</button>`}</div>`}

/* ============ GAMES ============ */
function vPlay(){const w=curW();const best=S.best||{};const n=learnedCards().length;
 const games=[
 ['g-listen','🎧','سمع وجاوب','شي واحد كيهضر معاك، ختار الجواب الصحيح — كلشي بالانجليزية',best.listen],
 ['g-dict','✍️','سمع وكتب','سمع الجملة وكتبها (Dictation)',best.dict],
 ['g-rush','⚡','60 ثانية','واش هاد الجواب مناسب؟ ✅ ولا ❌ — بالزربة!',best.rush],
 ['g-order','🧩','رتب الجملة','رتب الكلمات باش تبني جملة صحيحة',best.order],
 ['g-say','🗣️','قولها','قول الجملة بصوتك والتطبيق يشوف واش صحيحة',best.say],
 ['pron','👅','نطق السيمانة',W[w].pr[0],null]];
 return header()+`<h2>🎮 ألعاب</h2><div class="muted">العب ملي تكون خاوي وسط النهار. الألعاب كتستعمل غير الجمل لي قريتي (${n} جملة) + جمل على قد النيفو ديالك.</div>
 ${games.map(g=>`<div class="step" data-act="${g[0]}"><div class="ic">${g[1]}</div><div class="tx"><b>${g[2]}</b><span class="muted">${esc(g[3])}</span></div>${g[4]!=null?`<span class="badge g">🏅 ${g[4]}</span>`:'◀'}</div>`).join('')}
 ${!canSpeak()?'<div class="card muted">🔈 الصوت ما خدامش فهاد التيليفون. شوف واش «Google Text-to-Speech» مفعّل فالإعدادات.</div>':''}`}
function needCards(n){const L=learnedCards();if(L.length<n){toast('قرا شي درس قبل 😉');return null}return L}
function gListen(){const rp=pick(RP.filter(r=>r[0]<=curW()),8).map(mkReply);const L=learnedCards();pick(L,Math.min(4,L.length)).forEach(c=>rp.splice(Math.floor(Math.random()*rp.length),0,mkQ(c,ALL.filter(x=>x.w<=curW()),'listen')));runQuiz('🎧 سمع وجاوب',rp,(s)=>{best('listen',s);mark('g',3)})}
function gDict(){const L=needCards(3);if(!L)return;if(!canSpeak()){toast('الصوت ما خدامش فهاد التيليفون');return}const qs=pick(L,8).map(c=>({k:'type',c,dict:true}));runQuiz('✍️ سمع وكتب',qs,(s)=>{best('dict',s);mark('g',3)})}
function best(k,s){S.best=S.best||{};S.best[k]=Math.max(S.best[k]||0,s)}
function gOrder(){const L=needCards(2);if(!L)return;const c=pick(L.filter(c=>firstAlt(c.en).split(' ').length>=3),8);if(!c.length){toast('مازال الجمل قصار، قرا شي درس آخر');return}open({type:'order',cs:c,i:0,picked:[],score:0,res:null})}
const words=en=>firstAlt(en).replace(/[.!?,]/g,'').split(/\s+/).filter(Boolean);
function vOrder(){const v=view;if(v.i>=v.cs.length)return backBar('🧩 رتب')+`<div class="card center"><div style="font-size:3rem">🧩</div><h2>${v.score}/${v.cs.length}</h2><button class="btn full g" data-act="oend">سالي ✓</button></div>`;
 const c=v.cs[v.i];if(!v.ws)v.ws=shuffle(words(c.en).map((w,i)=>({w,i})));
 return backBar('🧩 '+(v.i+1)+'/'+v.cs.length)+`<div class="card"><div class="muted center">رتب الكلمات (المعنى: ${esc(c.ar)})</div>
 <div class="slot" style="margin:10px 0">${v.picked.map(k=>`<span class="word" data-un="${k}">${esc(v.ws[k].w)}</span>`).join('')}</div>
 <div style="direction:ltr;text-align:center">${v.ws.map((x,k)=>`<span class="word ${v.picked.includes(k)?'used':''}" data-w="${k}">${esc(x.w)}</span>`).join('')}</div>
 ${v.res?`<div class="fb ${v.res}">${v.res==='ok'?'🎉 Perfect!':'💪 الصحيحة:'}<div class="en">${esc(firstAlt(c.en))}</div></div><div class="row" style="justify-content:center;margin-top:6px">${spk(c.en)}</div><button class="btn full g" style="margin-top:10px" data-act="onext">التالي ←</button>`:
 `<button class="btn full b" style="margin-top:12px" data-act="ocheck" ${v.picked.length<v.ws.length?'disabled':''}>تحقق</button>`}</div>`}
function gRush(){const rp=RP.filter(r=>r[0]<=curW());open({type:'rush',pool:rp,t:60,score:0,q:null,started:false,fb:null,prev:(S.best&&S.best.rush)||0})}

 <p class="muted center">تقدر تحل أي درس باش تراجعو. التقدم ديالك كيتسجل أوتوماتيكيا فالتيليفون.</p>

 <div class="card muted">🎤 يلا الميكرو ما خدامش: الإعدادات ← التطبيقات ← Yalla English ← الأذونات ← الميكرو ← سمح.<br>🔊 يلا الصوت ما خدامش: تأكد بلي «Google Speech Services» مثبت ومفعّل.</div>`}

/* ============ EVENTS ============ */
function bindView(){}
document.addEventListener('click',e=>{const t=e.target.closest('[data-tab],[data-act],[data-say],[data-slow],[data-opt],[data-mic],[data-mode],[data-tr],[data-wk],[data-les],[data-w],[data-un],[data-rush],[data-place]');if(!t)return;
 if(t.dataset.tab){go(t.dataset.tab);return}
 if(t.dataset.say!=null){speak(t.dataset.say);return}
 if(t.dataset.slow!=null){speak(t.dataset.slow,.65);return}
 if(t.dataset.mic){micClick(t.dataset.mic,t);return}
 if(t.dataset.opt!=null){answerOpt(+t.dataset.opt);return}
 if(t.dataset.mode){S.chat.mode=t.dataset.mode;S.chat.msgs=[];save();render();return}
 if(t.dataset.tr!=null){translate(+t.dataset.tr);return}
 if(t.dataset.wk!=null){openW=openW===+t.dataset.wk?-1:+t.dataset.wk;render();return}
 if(t.dataset.les!=null){startLesson(+t.dataset.les);return}
 if(t.dataset.w!=null){const v=view;v.picked.push(+t.dataset.w);render();return}
 if(t.dataset.un!=null){const v=view;if(v.res)return;v.picked=v.picked.filter(k=>k!==+t.dataset.un);render();return}
 if(t.dataset.rush!=null){rushAns(+t.dataset.rush);return}
 if(t.dataset.place!=null){startPlace(+t.dataset.place,true);return}
 const a=t.dataset.act,v=view;
 switch(a){
 case 'back':clearInterval(rushTimer);if(v&&v.type==='call'){hangUp();break}back();break;
 case 'lesson':startLesson(S.g);break;
 case 'review':startReview(false);break;
 case 'free':startReview(true);break;
 case 'night':nightQuiz();break;
 case 'chatgo':S.chat.mode=S.chat.mode||'lesson';go('chat');break;
 case 'go-play':go('play');break;case 'go-watch':go('watch');break;
 case 'pron':startPron();break;
 case 'pronsay':{const P=W[curW()].pr[2].map((x,i)=>({id:'pr'+i,en:x,ar:'',pr:''}));gSay(P);break}
 case 'lstart':v.i=0;v.ans='';v.res=null;render();break;
 case 'lcheck':{const val=$('#ans').value;v.ans=val;v.res=grade(val,W[Math.floor(v.g/7)].L[v.g%7].p[v.i].en);render();if(v.res!=='no')speak(W[Math.floor(v.g/7)].L[v.g%7].p[v.i].en);break}
 case 'lshow':v.ans=$('#ans').value;v.res='no';render();break;
 case 'lnext':v.i++;v.ans='';v.res=null;render();break;
 case 'lfinish':finishLesson();toast('+10 ⭐ برافو!');view=null;go('home');break;
 case 'lchat':finishLesson();S.chat.mode='lesson';S.chat.msgs=[];save();go('chat');break;
 case 'reveal':v.revealed=true;{const q=v.qs[v.i];const box=document.createElement('div');box.className='big en';box.textContent=q.r[1];t.replaceWith(box)}break;
 case 'qtype':answerType();break;
 case 'qnext':v.i++;v.ans=null;v.txt='';render();if(v.i<v.qs.length&&canSpeak()){const q=v.qs[v.i];if(q.k==='listen')speak(q.c.en);else if(q.k==='reply')speak(q.r[1]);else if(q.k==='type'&&q.dict)speak(q.c.en)}break;
 case 'qend':{const cb=v.onEnd;const s=v.score,n=v.qs.length;view=null;go('home');cb&&cb(s,n);save();if(!view)render();break}
 case 'rflip':v.flip=true;render();speak(BYID[v.ids[v.i]].en);break;
 case 'rok':srs(v.ids[v.i],true);v.ok++;S.xp+=1;v.i++;v.flip=false;save();render();break;
 case 'rno':srs(v.ids[v.i],false);if(!v.again.includes(v.ids[v.i])){v.again.push(v.ids[v.i]);v.ids.push(v.ids[v.i])}S.weak=[v.ids[v.i],...S.weak.filter(x=>x!==v.ids[v.i])].slice(0,20);v.i++;v.flip=false;save();render();break;
 case 'rend':if(!v.free)mark('r',3);else mark('g',2);view=null;go('home');break;
 case 'g-listen':gListen();break;case 'g-dict':gDict();break;case 'g-order':gOrder();break;case 'g-rush':gRush();break;case 'g-say':gSay();break;
 case 'ocheck':{const c=v.cs[v.i];const built=v.picked.map(k=>v.ws[k].w).join(' ');v.res=norm(built)===norm(firstAlt(c.en))?'ok':'no';if(v.res==='ok'){v.score++;S.xp+=2;speak(c.en)}render();break}
 case 'onext':v.i++;v.picked=[];v.ws=null;v.res=null;render();break;
 case 'oend':best('order',v.score);mark('g',3);view=null;go('play');break;
 case 'rgo':rushStart();break;
 case 'rushend':best('rush',v.score);mark('g',3);view=null;go('play');break;
 case 'sretry':v.heard='';v.res=null;render();break;
 case 'snext':v.i++;v.heard='';v.res=null;v.counted=false;render();break;
 case 'sself':v.score++;v.i++;render();break;
 case 'send':best('say',v.score);mark('g',3);view=null;go('play');break;
 case 'cstart':chatCall();break;
 case 'call':startCall();break;
 case 'calltalk':callListen();break;
 case 'hangup':hangUp();break;
 case 'callrep':{const l=[...v.lines].reverse().find(x=>!x.me&&x.t);if(l)speak(l.t);break}
 case 'place':startPlace(Math.floor(Math.min(S.g,TOTAL-1)/7));break;
 case 'noplace':S.placed=1;save();render();break;
 case 'settings':open({type:'settings'});break;
 case 'savekey':{const k=($('#key').value||'').trim();try{localStorage.setItem('yalla-gemini-key',k);localStorage.removeItem('yalla-model')}catch(e){}v&&(v.msg='⏳ كنجرب…');render();viaGemini('Say only: OK').then(()=>{view.msg='✅ خدام! Sam واجد يهضر معاك.';render()}).catch(e=>{view.msg=e&&e.code==='bad_key'?'❌ المفتاح ماشي صحيح':e&&e.code==='rate_limited'?'⏳ بزاف ديال الطلبات، عاود من بعد':'📶 ما قدرتش نتأكد، شوف الانترنت';render()});break}
 case 'backup':{const t=JSON.stringify(S);navigator.clipboard.writeText(t).then(()=>toast('✅ تكوبيات! حطها فشي بلاصة آمنة')).catch(()=>{$('#bk').value=t;$('#bk').select()});break}
 case 'restore':{try{const r=JSON.parse($('#bk').value);if(r&&r.v===1){S=Object.assign(fresh(),r);save();toast('✅ رجعات النسخة');go('home')}else toast('❌ النسخة ماشي صحيحة')}catch(e){toast('❌ النسخة ماشي صحيحة')}break}
 case 'csend':chatSend();break;
 case 'chint':chatHint();break;
 case 'cnew':chatCtl&&chatCtl.abort();S.chat.msgs=[];chatBusy=false;save();render();break;
 }});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){if(e.target.id==='cin'){e.preventDefault();chatSend()}else if(e.target.id==='ans'){e.preventDefault();const b=document.querySelector('[data-act=lcheck],[data-act=qtype]');b&&b.click()}}});

/* ============ INIT (standalone app) ============ */
// --- Speech recognition (mic) ---
(function(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;
 let rec=null,cbF=[],cbP=[],cbS=[];
 const emit=(a,x)=>a.forEach(f=>{try{f(x)}catch(e){}});
 dict={start(){return new Promise((res,rej)=>{try{rec=new SR();rec.lang='en-US';rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;
  rec.onstart=()=>{emit(cbS,{state:'listening'});res()};
  rec.onresult=e=>{let fin='',part='';for(let k=e.resultIndex;k<e.results.length;k++){const r=e.results[k];if(r.isFinal)fin+=r[0].transcript;else part+=r[0].transcript}if(part)emit(cbP,{text:part});if(fin)emit(cbF,{text:fin})};
  rec.onerror=e=>{emit(cbS,{state:'idle',reason:e.error});if(e.error==='not-allowed'){toast('عطي الإذن للميكرو من الإعدادات ديال التيليفون')}};
  rec.onend=()=>emit(cbS,{state:'idle',reason:'stopped'});rec.start()}catch(e){rej(e)}})},
  stop(){try{rec&&rec.stop()}catch(e){}return Promise.resolve()},
  onFinal(f){cbF.push(f)},onPartial(f){cbP.push(f)},onState(f){cbS.push(f)}};
 dict.onPartial(({text})=>{if(micTarget==='call'){const e=document.getElementById('callheard');if(e&&view)e.textContent=((view.heard||'')+' '+text).trim();return}if(micTarget==='say'){const v=view;if(v&&v.type==='say'){v.heard=text}}});
 dict.onFinal(({text})=>{if(micTarget==='call'){if(view&&view.type==='call'){view.heard=((view.heard||'')+' '+text).trim();const e=document.getElementById('callheard');if(e)e.textContent=view.heard}return}if(micTarget==='say'){sayHeard(((view&&view.heardFinal)||'')+' '+text);if(view)view.heardFinal=((view.heardFinal||'')+' '+text).trim();return}const el=document.getElementById(micTarget);if(el){el.value=(el.value?el.value+' ':'')+text.trim();el.focus()}});
 dict.onState(({state,reason})=>{listening=state==='listening';if(micTarget==='call'){callState(state,reason);return}if(state==='listening'&&view&&view.type==='say'){view.heardFinal='';view.res=null}document.querySelectorAll('[data-mic]').forEach(b=>{if(b.dataset.mic!=='say')b.textContent=listening?'⏹️':'🎤'});if(view&&view.type==='say')render()});
})();
// load voices early (Android needs this)
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices()}catch(e){}
// --- AI (Sam) through Google Gemini, free key stored only on this phone ---
const MODELS=['gemini-flash-latest','gemini-3.5-flash','gemini-2.5-flash','gemini-flash-lite-latest'];
function getKey(){try{return localStorage.getItem('yalla-gemini-key')||''}catch(e){return ''}}
function toMsgs(input){return typeof input==='string'?[{role:'user',content:input}]:input.map(m=>({role:m.role==='assistant'?'assistant':'user',content:m.content}))}
async function viaGemini(input,opts){const key=getKey();if(!key)throw {code:'skip'};
 const contents=toMsgs(input).map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:m.content}]}));
 let order=MODELS.slice();const ok=localStorage.getItem('yalla-model');if(ok)order=[ok,...order.filter(m=>m!==ok)];
 for(const m of order){const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({contents}),signal:opts&&opts.signal});
  if(r.status===404)continue;if(r.status===429)throw {code:'rate_limited'};if(r.status===400||r.status===401||r.status===403)throw {code:'bad_key'};if(!r.ok)throw {code:'net'};
  const j=await r.json();const text=((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(p=>p.text||'').join('');
  try{localStorage.setItem('yalla-model',m)}catch(e){}if(!text)throw {code:'net'};return text}
 throw {code:'net'}}
async function viaOpenAI(url,headers,model,input,opts){const r=await fetch(url,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},headers),body:JSON.stringify({model,messages:toMsgs(input)}),signal:opts&&opts.signal});
 if(r.status===429)throw {code:'rate_limited'};if(!r.ok)throw {code:'net'};const j=await r.json();const t=j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;if(!t)throw {code:'net'};return String(t)}
// Free providers that need NO account and NO key. Tried in order; the first that answers wins.
const FREE=[
 (i,o)=>viaOpenAI('https://api.llm7.io/v1/chat/completions',{'Authorization':'Bearer unused'},'default',i,o),
 (i,o)=>viaOpenAI('https://text.pollinations.ai/openai',{},'openai',i,o)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function gemini(input,opts){let last=null;
 const chain=[viaGemini,...FREE];let pref=+(localStorage.getItem('yalla-prov')||0);
 const idx=[...chain.keys()];if(pref>0&&pref<chain.length){idx.splice(idx.indexOf(pref),1);idx.splice(1,0,pref)}
 // try every provider; if all are busy, wait quietly and try again (up to ~25s) instead of bothering the learner
 const waits=[0,3000,7000,12000];
 for(const w of waits){if(w){opts&&opts.onWait&&opts.onWait();await sleep(w)}if(opts&&opts.signal&&opts.signal.aborted)throw {name:'AbortError'};
  let onlyBusy=true;
  for(const k of idx){try{const text=await chain[k](input,opts);if(k>0)try{localStorage.setItem('yalla-prov',k)}catch(e){};opts&&opts.onText&&opts.onText({text});return {text}}
   catch(e){if(e&&e.name==='AbortError')throw e;if(e&&e.code==='skip')continue;last=e&&e.code?e:{code:'net'};if(last.code!=='rate_limited')onlyBusy=onlyBusy&&false}}
  if(!onlyBusy&&w>=3000)break}
 throw last||{code:'net'}}
sample=gemini;
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
render();
